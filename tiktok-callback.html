<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connected | Night Files</title><style>
:root{color-scheme:dark}
body{margin:0;background:#0d0f12;color:#d9dde3;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:48px 20px 80px}
h1{font-size:2rem;margin:0 0 4px;color:#fff}
h2{font-size:1.15rem;margin:32px 0 8px;color:#fff}
.muted{color:#8b93a1;font-size:.9rem}
a{color:#ffd84d}
code{background:#1a1e24;padding:12px 14px;border-radius:8px;display:block;word-break:break-all;font-size:.95rem;color:#fff}
button{margin-top:12px;background:#ffd84d;color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
</style></head><body><main>
<h1>TikTok connected</h1>
<p id="msg" class="muted">Reading your login code&hellip;</p>
<code id="url"></code>
<button id="copy">Copy full URL</button>
<p class="muted">Paste this into GitHub &rarr; Actions &rarr; <b>Connect TikTok (one time)</b> &rarr; Run workflow, within about 5 minutes.</p>
<script>
const u=location.href, has=new URLSearchParams(location.search).has('code');
document.getElementById('url').textContent=u;
document.getElementById('msg').textContent=has?'Login code received. Copy the URL below.':'No code found in this URL. Start the TikTok login again.';
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(u).then(()=>{document.getElementById('copy').textContent='Copied'});
</script>
</main></body></html>
