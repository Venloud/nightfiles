<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snapchat OAuth Callback</title></head><body><h1>Snapchat authorization</h1><p id="status">Reading authorization response...</p><pre id="result"></pre><script>const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error'),d=p.get('error_description'),s=document.getElementById('status'),r=document.getElementById('result');if(c){s.textContent='Authorization code received. Copy it now, then close this page.';r.textContent=c}else if(e){s.textContent='Authorization failed.';r.textContent=d?e+': '+d:e}else{s.textContent='OAuth callback is ready.'}</script></body></html>
